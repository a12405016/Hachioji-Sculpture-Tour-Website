<script>(function(){const f={"北八王子エリア":"hachioji_kita","西八王子エリア":"hachioji_nishi","八王子市役所エリア":"hachioji_siyakusyo","片倉エリア":"katakura","北野エリア":"kitano","高尾エリア":"takao","多摩センターエリア":"tama_keiou","南大沢エリア":"tama_minami","その他エリア":"other"};const a=document.getElementById('popAudio'),b=document.getElementById('audioPlayButton'),o=window.openPopup;window.openPopup=function(id){o(id);const s=SCULPTURES.find(x=>x.id===id),m=(s.story||'').match(/file\.?\s*(\d+)/i);a.src=s.audio||(m&&f[s.area]?'../narration/'+f[s.area]+'/file_'+m[1]+'.mp3':'');a.load();a.pause();b.textContent='▶'};b.onclick=()=>a.src&&(a.paused?a.play():a.pause());a.onplay=()=>b.textContent='Ⅱ';a.onpause=()=>b.textContent='▶';a.onended=()=>{a.currentTime=0;b.textContent='▶'}})();</script></body>
