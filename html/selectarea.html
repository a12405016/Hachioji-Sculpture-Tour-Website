<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="八王子市彫刻巡りスタンプラリーの公式サイトです。">
    <meta name="keywords" content="八王子市, 彫刻巡り, スタンプラリー, 公式サイト">
    <meta property="og:title" content="八王子市彫刻巡りスタンプラリー公式サイト">
    <meta property="og:description" content="八王子市彫刻巡りスタンプラリーの公式サイトです。">
    <meta property="og:image" content="images/herofavicon.png">
    <title>エリア選択_八王子市彫刻巡りスタンプラリー</title>
    <link rel="stylesheet" href="../css/selectarea.css">
    <link rel="icon" href="../images/herofavicon.png">
</head>

<body>
    <main>
        <header id="header0">
            <h1><img src="../images/headericon.png" alt="八王子市彫刻巡りスタンプラリー"></h1>
        </header>

        <div class="section-title-wrapper">
            <div class="section-title-bg">
                <div class="section-title-text">行きたいエリアを選択しよう！</div>
            </div>
        </div>

        <div class="map-container">
            <img src="../images/areamap.png" alt="八王子市全体のエリアマップ" class="map-image">
            <div class="map-area-buttons" aria-label="エリアを選択">
                <button class="map-area other" type="button">その他エリア</button>
                <button class="map-area city-hall" type="button">市役所エリア</button>
                <button class="map-area kita-hachioji" type="button">北八王子エリア</button>
                <button class="map-area hachioji-station" type="button">八王子駅エリア</button>
                <button class="map-area nishi-hachioji" type="button">西八王子エリア</button>
                <button class="map-area takao" type="button">高尾エリア</button>
                <button class="map-area katakura" type="button">片倉エリア</button>
                <button class="map-area kitano" type="button">北野エリア</button>
                <button class="map-area tama-center" type="button">多摩センター<br>エリア</button>
                <button class="map-area minami-osawa" type="button">南大沢エリア</button>
            </div>
        </div>

        <div class="button-wrapper">
            <a href="../index.html" class="btn-back">ホームページに戻る</a>
        </div>
        <div class="map-btn-wrap">
            <a href="https://app.mobilites.ashibi.jp/200/index.html" target="_blank" rel="noopener noreferrer"
                class="map-btn">
                スタンプラリーをはじめる
            </a>
        </div>
    </main>
    <div class="bg-decorations">
        <img src="../images/header_gradation.png" alt="" class="decor-img header-grad">
    </div>
</body>

</html>
